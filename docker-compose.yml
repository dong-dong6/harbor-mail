services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-mailclient}
      POSTGRES_USER: ${DATABASE_USER:-mailclient}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Do not publish the database port.
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      BIND_ADDRESS: 0.0.0.0
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-mailclient}
      DATABASE_USER: ${DATABASE_USER:-mailclient}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      MAIL_ADMIN_USERNAME: ${MAIL_ADMIN_USERNAME:-admin}
      MAIL_ADMIN_PASSWORD: ${MAIL_ADMIN_PASSWORD:?Set MAIL_ADMIN_PASSWORD}
      MAIL_ENCRYPTION_KEY: ${MAIL_ENCRYPTION_KEY:?Set MAIL_ENCRYPTION_KEY}
      MAIL_ALLOWED_ORIGIN: ${MAIL_ALLOWED_ORIGIN:?Set your public HTTPS origin}
      MAIL_OAUTH_GMAIL_CLIENT_ID: ${MAIL_OAUTH_GMAIL_CLIENT_ID:-}
      MAIL_OAUTH_GMAIL_CLIENT_SECRET: ${MAIL_OAUTH_GMAIL_CLIENT_SECRET:-}
      MAIL_OAUTH_GMAIL_REDIRECT_URI: ${MAIL_OAUTH_GMAIL_REDIRECT_URI:-}
      MAIL_OAUTH_OUTLOOK_CLIENT_ID: ${MAIL_OAUTH_OUTLOOK_CLIENT_ID:-}
      MAIL_OAUTH_OUTLOOK_CLIENT_SECRET: ${MAIL_OAUTH_OUTLOOK_CLIENT_SECRET:-}
      MAIL_OAUTH_OUTLOOK_REDIRECT_URI: ${MAIL_OAUTH_OUTLOOK_REDIRECT_URI:-}
      MAIL_OAUTH_OUTLOOK_TENANT: ${MAIL_OAUTH_OUTLOOK_TENANT:-consumers}
      MAIL_OAUTH_EXCHANGE_CLIENT_ID: ${MAIL_OAUTH_EXCHANGE_CLIENT_ID:-}
      MAIL_OAUTH_EXCHANGE_CLIENT_SECRET: ${MAIL_OAUTH_EXCHANGE_CLIENT_SECRET:-}
      MAIL_OAUTH_EXCHANGE_REDIRECT_URI: ${MAIL_OAUTH_EXCHANGE_REDIRECT_URI:-}
      MAIL_OAUTH_EXCHANGE_TENANT: ${MAIL_OAUTH_EXCHANGE_TENANT:-organizations}
    volumes:
      - mail-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  postgres-data:
  mail-data:
