name: Build and release

on:
  push:
    branches: ['**', '!debug/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep development validation snapshots independent; never cancel an earlier APK check.
  group: build-${{ github.workflow }}-${{ github.ref == 'refs/heads/work/v0.3.0-device-auth' && github.sha || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  android-apk:
    name: Build verified development Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      BOT: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      HARBOR_ANDROID_NDK_VERSION: '29.0.14206865'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Flutter SDK from official archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.5-stable.tar.xz \
            --output "$RUNNER_TEMP/flutter.tar.xz"
          echo "2132e990f236f8d22e7c6314b29a191a95b10d7cbcfec9b4e2e303d996652cbb  $RUNNER_TEMP/flutter.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          # Discard only this job's downloaded SDK archive before native build/artifact copies.
          rm -f "$RUNNER_TEMP/flutter.tar.xz"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Test native session and installer policies with synthetic fixtures
        run: |
          bash client/android/tests/run-session-vault-tests.sh
          bash client/android/tests/run-policy-tests.sh
          python3 scripts/test-prepare-android-download.py
      - name: Build this checkout using the runner's preinstalled Android SDK
        # Fails closed if a required SDK component/license is absent; never accepts licenses.
        # Ephemeral default debug signing only. No production keystore or persistent key cache.
        run: bash scripts/build-android-download.sh
      - name: Report remaining disk and compiled APK size
        if: always()
        shell: bash
        run: |
          df -h "$GITHUB_WORKSPACE"
          APK=client/build/app/outputs/flutter-apk/app-debug.apk
          if [ -f "$APK" ]; then stat -c 'Compiled APK bytes: %s' "$APK"; fi
      - name: Preserve verified development APK and manifest
        uses: actions/upload-artifact@v7
        with:
          name: android-development-${{ github.sha }}
          path: server/src/main/resources/META-INF/android-download/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows-native:
    name: Compile Windows native authentication plugins
    # The preinstalled Visual Studio 2022 C++ toolchain builds both plugins.
    # Compile only: never launches Windows Hello, creates passkeys, or signs binaries.
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      CI: 'true'
      BOT: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install checksum-verified Flutter Windows SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'flutter-windows.zip'
          curl.exe --fail --location --retry 3 `
            https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_3.47.5-stable.zip `
            --output $archive
          if ($LASTEXITCODE -ne 0) { throw 'Flutter SDK download failed' }
          # Pinned x64 release entry from the official manifest:
          # https://storage.googleapis.com/flutter_infra_release/releases/releases_windows.json
          $expected = '0ccd71931f49c2fbe394b1eeb6d79af3d624058a043ea0d03d34160581624fb8'
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Flutter SDK SHA-256 mismatch' }
          tar.exe -xf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Flutter SDK extraction failed' }
          (Join-Path $env:RUNNER_TEMP 'flutter\bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build unsigned Windows release bundle
        working-directory: client
        run: |
          $ErrorActionPreference = 'Stop'
          flutter --version
          if ($LASTEXITCODE -ne 0) { throw 'Flutter SDK verification failed' }
          flutter config --enable-windows-desktop
          if ($LASTEXITCODE -ne 0) { throw 'Windows desktop configuration failed' }
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency resolution failed' }
          flutter build windows --release --no-pub
          if ($LASTEXITCODE -ne 0) { throw 'Windows native release compilation failed' }
          $bundle = 'build\windows\x64\runner\Release'
          foreach ($name in @('harbor_mail.exe', 'local_auth_windows_plugin.dll', 'passkeys_windows_plugin.dll')) {
            $file = Join-Path $bundle $name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required native output missing: $name"
            }
            Get-FileHash -LiteralPath $file -Algorithm SHA256
          }
      - name: Preserve unsigned Windows CI build
        uses: actions/upload-artifact@v7
        with:
          name: windows-native-${{ github.sha }}
          path: client/build/windows/x64/runner/Release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  passkey-protocol:
    name: Verify isolated WebAuthn protocol
    # Protocol verification is independent of native SDK builds and Flutter Web.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      MAIL_MAVEN_REPO: ${{ github.workspace }}/tools/m2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Package isolated backend without Web or Android resources
        run: mvn -B -f server/pom.xml -Dmaven.repo.local="$MAIL_MAVEN_REPO" -DskipTests package
      - name: Install pinned browser harness and Chromium
        run: |
          npm ci --prefix client/tool --ignore-scripts --no-audit --no-fund
          client/tool/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise registration, passwordless login, replay and origin rejection
        shell: bash
        run: |
          VERSION="$(python3 scripts/check-version.py)"
          BROWSER_PATH=$(node -e "process.stdout.write(require('./client/tool/node_modules/playwright').chromium.executablePath())")
          CHROMIUM_PATH="$BROWSER_PATH" bash scripts/test-passkeys-browser.sh "server/target/mail-server-$VERSION.jar"
      - name: Preserve synthetic protocol results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: passkey-protocol-${{ github.sha }}
          path: test-results/passkeys-browser.json
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Test and build Web + Java
    needs: android-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      BOT: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      MAIL_MAVEN_REPO: ${{ github.workspace }}/tools/m2
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mail_test
          POSTGRES_USER: mail_test
          # Disposable runner-only test database; never a real account.
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mail_test -d mail_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Flutter SDK from official archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.5-stable.tar.xz \
            --output "$RUNNER_TEMP/flutter.tar.xz"
          echo "2132e990f236f8d22e7c6314b29a191a95b10d7cbcfec9b4e2e303d996652cbb  $RUNNER_TEMP/flutter.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/flutter.tar.xz" -C "$RUNNER_TEMP"
          # Discard only this job's downloaded SDK archive before native build/artifact copies.
          rm -f "$RUNNER_TEMP/flutter.tar.xz"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Check toolchain and release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          java --version
          mvn --version
          flutter --version
          python3 scripts/check-version.py
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test synthetic OAuth and isolated HTML rendering
        shell: bash
        run: |
          npm ci --prefix client/tool --ignore-scripts --no-audit --no-fund
          npm test --prefix client/tool
          node client/tool/test_passkeys_flutter_browser_unit.cjs
          client/tool/node_modules/.bin/playwright install --with-deps chromium
          BROWSER_PATH=$(node -e "process.stdout.write(require('./client/tool/node_modules/playwright').chromium.executablePath())")
          CHROMIUM="$BROWSER_PATH" CHROMIUM_PATH="$BROWSER_PATH" npm run test:browser --prefix client/tool
      - name: Include same-run verified APK in private JAR resources
        uses: actions/download-artifact@v8
        with:
          name: android-development-${{ github.sha }}
          path: server/src/main/resources/META-INF/android-download
      - name: Analyze, test (H2), build Web, and package integrated JAR
        run: bash scripts/build.sh
      - name: Preserve compiled Web for isolated browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-browser-debug-${{ github.sha }}
          path: client/build/web/
          if-no-files-found: warn
          retention-days: 3
      - name: Test real Web headers, inline reply input and browser history
        shell: bash
        run: |
          BROWSER_PATH=$(node -e "process.stdout.write(require('./client/tool/node_modules/playwright').chromium.executablePath())")
          CHROMIUM_PATH="$BROWSER_PATH" npm run test:mail-routes --prefix client/tool
      - name: Verify passkey protocol with isolated Chromium virtual authenticator
        shell: bash
        run: |
          BROWSER_PATH=$(node -e "process.stdout.write(require('./client/tool/node_modules/playwright').chromium.executablePath())")
          CHROMIUM_PATH="$BROWSER_PATH" bash scripts/test-passkeys-browser.sh
      - name: Verify actual Flutter Web passkey UI and pinned local plugin bridge
        shell: bash
        run: |
          BROWSER_PATH=$(node -e "process.stdout.write(require('./client/tool/node_modules/playwright').chromium.executablePath())")
          CHROMIUM_PATH="$BROWSER_PATH" bash scripts/test-passkeys-flutter-browser.sh
      - name: Preserve H2 test reports
        if: always()
        run: |
          mkdir -p test-results/h2
          if [ -d server/target/surefire-reports ]; then
            cp -R server/target/surefire-reports/. test-results/h2/
          fi
      - name: Test backend with PostgreSQL
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/mail_test
          TEST_DATABASE_USER: mail_test
          TEST_DATABASE_PASSWORD: ci-only-not-a-secret
        run: mvn -B -f server/pom.xml -Dmaven.repo.local="$MAIL_MAVEN_REPO" test
      - name: Smoke test the integrated demo JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          java -jar dist/mail-client.jar --spring.profiles.active=demo > test-results/demo.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/ -o "$RUNNER_TEMP/index.html"; then
              ready=true
              break
            fi
            kill -0 "$app_pid" || { cat test-results/demo.log; exit 1; }
            sleep 2
          done
          "$ready" || { cat test-results/demo.log; exit 1; }
          grep -q flutter_bootstrap.js "$RUNNER_TEMP/index.html"
          python3 scripts/smoke-demo.py --url http://127.0.0.1:8080
          python3 scripts/smoke-android-download.py --url http://127.0.0.1:8080 --source-commit "$GITHUB_SHA"
          python3 scripts/smoke-static-assets.py --url http://127.0.0.1:8080 > test-results/static-assets-http.json
      - name: Create complete archive and checksum
        run: bash scripts/package.sh
      - name: Upload complete runnable build
        uses: actions/upload-artifact@v7
        with:
          name: mail-client-${{ github.sha }}
          path: |
            dist/mail-client-v*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: |
            test-results/
            server/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publish tagged release
    needs: [build, windows-native, passkey-protocol]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No checkout or execution of project code in the write-token job.
      - uses: actions/download-artifact@v8
        with:
          name: mail-client-${{ github.sha }}
          path: dist
      - name: Verify archive and create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          # Never overwrite an existing release or its downloadable assets.
          gh release create "$RELEASE_TAG" \
            "mail-client-${RELEASE_TAG}.zip" SHA256SUMS \
            --verify-tag --title "Harbor Mail $RELEASE_TAG" \
            --notes "Complete source + Flutter Web/Java 21 runtime archive. Extract the ZIP and follow README.md. Includes a development-debug Android APK at /downloads/android/app.apk when the JAR is running. This is a test build, not a production-signed installer; see docs/ANDROID_DOWNLOADS.md."
