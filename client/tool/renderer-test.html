<!doctype html><meta charset="utf-8"><title>合成邮件安全测试</title><script src="../web/mail_renderer.js"></script><h2>合成邮件安全测试</h2><pre id="results"></pre><main></main><script>
const tests=[];function check(ok,label){tests.push((ok?'PASS ':'FAIL ')+label)};
const raw="<script>parent.hacked=true<\/script><img src=\"https://tracker.invalid/pixel\" onerror=\"parent.hacked=true\"><a href=\"javascript:alert(1)\" ping=\"https://tracker.invalid/ping\">bad</a><iframe src=\"https://tracker.invalid/frame\"></iframe><meta http-equiv=\"refresh\" content=\"0;url=https://tracker.invalid\"><svg onload=\"alert(1)\"><image href=\"https://tracker.invalid/svg\"/></svg><style>@import 'https://tracker.invalid/css';</style><div style=\"background-image:url(https://tracker.invalid/bg);color:red;position:fixed\">safe</div><form action=\"https://tracker.invalid\"><input autofocus></form><img srcset=\"https://tracker.invalid/srcset 1x\"><table bgcolor=\"#e8edf3\" width=\"640\" cellpadding=\"24\" style=\"border-radius:24px\"><tr><td><h1 style=\"font-size:36px\">创意周刊</h1><p>这是合成邮件。排版与图片隐私测试。</p><a href=\"https://example.com/read?long=abcdef\" style=\"color:#0b57d0\">阅读详情</a></td><td style=\"background-color:#edf9df\">第二栏<br><img src=\"cid:local\" alt=\"内嵌图片\"></td></tr></table>";
const doc=harborRenderMail(raw,false);
check(!doc.includes('onerror'),'事件处理器被移除');check(!doc.includes('javascript:'),'危险链接被移除');check(!doc.includes('srcset'),'srcset 被移除');check(!doc.includes('background-image'),'CSS 远程资源被移除');check(!doc.includes('position:'),'定位样式被移除');check(doc.includes('border-radius:24px'),'保留圆角样式');check(doc.includes('noopener noreferrer'),'链接阻止 opener/referrer');check(!doc.includes('<script'),'脚本被移除');check(!doc.includes('src="https://'),'默认远程图片无请求入口');
const f=document.createElement('iframe');f.setAttribute('sandbox','allow-popups allow-popups-to-escape-sandbox');f.style='width:100%;height:600px;border:0';f.srcdoc=doc;document.querySelector('main').appendChild(f);f.onload=()=>{check(f.contentDocument===null,'不透明隔离来源');check(!window.hacked,'脚本未执行');document.querySelector('#results').textContent=tests.join('\n')};
const allowed=harborRenderMail('<img src="https://example.com/opt-in"><img src="data:image/svg+xml,x">',true);check(allowed.includes('src="https://example.com/opt-in"'),'仅明确允许后包含远程图片');check(!allowed.includes('data:image'),'禁止 SVG/data 图片');
</script>
