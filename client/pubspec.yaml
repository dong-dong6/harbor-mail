name: harbor_mail
description: A private self-hosted multi-account mail client.
publish_to: none
version: 0.3.0+6
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  crypto: ^3.0.7
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  local_auth: ^3.0.2
  passkeys: 2.23.1
  shared_preferences: ^2.5.4
  file_picker: ^10.3.10
  file_saver: ^0.3.1
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.otf
