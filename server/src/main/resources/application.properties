spring.application.name=personal-mail
server.port=${PORT:8080}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mail}
spring.datasource.username=${DATABASE_USER:mail}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=11MB
mail.encryption-key=${MAIL_ENCRYPTION_KEY:}
mail.admin-username=${MAIL_ADMIN_USERNAME:}
mail.admin-password=${MAIL_ADMIN_PASSWORD:}
mail.demo=false
mail.allowed-origin=${MAIL_ALLOWED_ORIGIN:http://localhost:3000}
mail.worker-enabled=true
# Single-node bounded polling; error accounts require manual retry to avoid credential hammering.
mail.poll-interval-ms=${MAIL_POLL_INTERVAL_MS:120000}

# Opt-in remembered devices: bounded short access + rotating refresh family.
mail.device-session.access-seconds=${MAIL_DEVICE_ACCESS_SECONDS:900}
mail.device-session.idle-days=${MAIL_DEVICE_IDLE_DAYS:30}
mail.device-session.absolute-days=${MAIL_DEVICE_ABSOLUTE_DAYS:365}
